apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbz-deployment-app2
  labels:
    app: cbz-app2
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cbz-app2
  template:
    metadata:
      labels:
        app: cbz-app2
    spec:
      containers:
      - name: cbz-app2
        image: 177603749127.dkr.ecr.ap-northeast-1.amazonaws.com/cbz/00:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 80
